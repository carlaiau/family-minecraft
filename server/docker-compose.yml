services:
  minecraft:
    # Immutable digest of the image that was running when dependencies were pinned.
    image: itzg/minecraft-server@sha256:9e09d64e8cab977f0152e1ca5f75d9ca972617cb946ef2f76acd4348bb950825
    container_name: minecraft-family
    restart: unless-stopped
    tty: true
    stdin_open: true

    ports:
      - "25565:25565/tcp"
      - "19132:19132/udp"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.2"
      PAPER_BUILD: "87"
      SERVER_NAME: "${SERVER_NAME:-Family Minecraft}"
      MOTD: "${MOTD:-Our family Minecraft world}"
      MEMORY: "${MEMORY:-3G}"
      MAX_PLAYERS: "${MAX_PLAYERS:-6}"
      MODE: "${MODE:-creative}"
      DIFFICULTY: "${DIFFICULTY:-peaceful}"
      PVP: "${PVP:-false}"
      ALLOW_FLIGHT: "${ALLOW_FLIGHT:-true}"
      SPAWN_PROTECTION: "0"
      ONLINE_MODE: "TRUE"
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/2.11.0/builds/1204/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/138/downloads/spigot
        https://github.com/BlueMap-Minecraft/BlueMap/releases/download/v5.22/bluemap-5.22-paper.jar
    volumes:
      - ./data:/data

    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m
