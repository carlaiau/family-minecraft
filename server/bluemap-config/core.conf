# Apply these values to data/plugins/BlueMap/core.conf.
#
# accept-download confirms the Minecraft account/EULA requirements described by
# BlueMap. Do not redistribute the client resources BlueMap downloads.
accept-download: true
data: "bluemap"
render-thread-count: 1
update-cooldown: 60
full-update-interval: 1440
scan-for-mod-resources: true
metrics: false

log: {
  file: "bluemap/logs/debug.log"
  append: false
}
